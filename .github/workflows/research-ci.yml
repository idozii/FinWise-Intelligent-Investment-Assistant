name: Research backtest tests
on:
  push:
    paths:
      - 'research/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/research-ci.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'tests/**'
      - '.github/workflows/research-ci.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'pytest>=8,<10' -r research/requirements-ml.txt
      - run: python -m pytest -q tests/test_backtest.py tests/test_ml_backtest.py tests/test_robustness.py tests/test_uncertainty.py tests/test_dashboard.py tests/test_calibration_audit.py tests/test_ridge_attribution.py tests/test_frozen_eval.py tests/test_m5_download.py tests/test_m5_tiingo_v2.py
